<style>
  :root{
    --bg:#FFF0F5;--card:#FFFFFF;--text:#4A2A35;--text-dim:#A8788A;--text-mid:#6B3D4D;
    --border:#F6D3E0;--border-light:#F0BCD1;--divider:#FBE3EC;--input-bg:#FFF4F8;
    --pink:#E0568C;--pink-dark:#9E2A5B;--pink-soft:#FFE3EE;
    --ok:#2E8B57;--ok-bg:#E3F5EA;--bad:#C2492F;--bad-bg:#FCE6E0;
    --font:'Poppins','Segoe UI','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
  }
  body.dark{
    --bg:#1d1117;--card:#2a1a22;--text:#fbe9f1;--text-dim:#c79ab0;--text-mid:#f0cddd;
    --border:#47293a;--border-light:#5c3a4d;--divider:#34202b;--input-bg:#241720;
    --pink-soft:#3a2230;--pink-dark:#ff9cc5;--ok-bg:#1d3a2a;--bad-bg:#472620;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:150px;transition:background .2s,color .2s}
  .wrap{max-width:760px;margin:0 auto;padding:0 14px}
  .header{background:linear-gradient(90deg,#FFE0EC,#FFF5F9);border-bottom:2px solid #F6C6D9;padding:12px 0;position:sticky;top:0;z-index:20}
  body.dark .header{background:linear-gradient(90deg,#3a2230,#2a1a22);border-bottom-color:#5c3a4d}
  .header .wrap{display:flex;align-items:center;gap:10px}
  .logo{width:42px;height:42px;border-radius:12px;background:#FFD3E4;border:2px solid #F5A9C7;overflow:hidden;flex-shrink:0}
  .logo img{width:30px;display:block;margin:3px auto 0}
  .titles{flex:1;min-width:0}
  .titles h1{font-size:18px;font-weight:700;color:var(--pink-dark)}
  .titles p{font-size:11.5px;color:var(--text-dim);margin-top:1px}
  .ibtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border-light);background:var(--card);cursor:pointer;font-size:17px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;color:inherit}

  body.dark #pig-tile{opacity:.10}
  #pig-deco img{position:fixed;bottom:-3px;pointer-events:none;user-select:none;z-index:4;transform-origin:50% 100%}
  #pig-deco .pg-big{right:6px;height:130px;animation:bob 3.2s ease-in-out infinite}
  #pig-deco .pg-l{left:6px;height:76px;animation:bob 2.6s ease-in-out infinite .5s}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(1.2deg)}}
  @media (max-width:560px){#pig-deco .pg-big{height:86px}#pig-deco .pg-l{height:54px}}
  @media (prefers-reduced-motion:reduce){#pig-deco img{animation:none!important}}

  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 8px}
  .chip{font:600 12px var(--font);padding:7px 14px;border-radius:16px;border:1.5px solid #F4A9C6;background:var(--pink-soft);color:var(--pink-dark);cursor:pointer}
  .chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
  .chip:disabled{opacity:.45;cursor:not-allowed}
  .meta{font-size:12px;color:var(--text-dim);margin-left:auto}
  .rules{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;font-size:12.5px;color:var(--text-mid);line-height:1.55;margin-bottom:10px}
  .quick{display:flex;gap:8px;margin-top:8px}
  .quick input{flex:1;min-width:0;font:500 14px var(--font);padding:9px 12px;border-radius:12px;border:1.5px solid var(--border-light);background:var(--input-bg);color:var(--text)}
  .quick button{white-space:nowrap}

  .q{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 2px 8px rgba(214,69,127,.08)}
  .q.right{border-color:var(--ok)}.q.wrong{border-color:var(--bad)}.q.skip{border-color:#E8B65B}
  .qhead{display:flex;gap:10px;align-items:flex-start}
  .qnum{background:var(--pink);color:#fff;font-weight:700;font-size:12px;border-radius:10px;padding:4px 9px;flex-shrink:0;margin-top:1px}
  .qtext{flex:1;font-size:15px;font-weight:600;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
  .spk{background:var(--pink-soft);border:1px solid #F4A9C6;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:14px;flex-shrink:0}
  .pic{margin:10px 0 2px;border:2px dashed #F4A9C6;border-radius:14px;background:var(--input-bg);text-align:center;padding:12px 8px}
  .pic .em{font-size:38px;letter-spacing:6px}
  .pic .cap{font-size:12px;color:var(--text-dim);margin-top:4px}
  .opts{display:grid;gap:8px;margin-top:10px}
  .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;font:500 14px var(--font);color:var(--text);padding:10px 12px;border-radius:12px;border:1.5px solid var(--border-light);background:var(--input-bg);cursor:pointer;line-height:1.45}
  .opt .L{font-weight:700;color:var(--pink-dark);min-width:18px}
  .opt.sel{border-color:var(--pink);background:var(--pink-soft)}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg)}
  .opt.incorrect{border-color:var(--bad);background:var(--bad-bg)}
  .opt:disabled{cursor:default}
  .why{margin-top:10px;font-size:12.5px;line-height:1.55;color:var(--text-mid);background:var(--pink-soft);border-radius:12px;padding:10px 12px}
  .why b{color:var(--pink-dark)}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:2px solid var(--border-light);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
  .bar .wrap{display:flex;align-items:center;gap:10px;padding-right:0}
  .prog{flex:1;min-width:0}
  .prog small{font-size:11.5px;color:var(--text-dim)}
  .track{height:8px;border-radius:6px;background:var(--divider);margin-top:4px;overflow:hidden}
  .fill{height:100%;background:linear-gradient(90deg,#EC6B9E,#E0568C);width:0;transition:width .25s}
  .go{font:700 14px var(--font);padding:11px 20px;border-radius:22px;border:none;background:var(--pink);color:#fff;cursor:pointer;margin-right:110px}
  @media (max-width:560px){.go{margin-right:70px;padding:11px 16px}}

  .result{background:var(--card);border:2px solid var(--pink);border-radius:18px;padding:18px;text-align:center;margin:12px 0}
  .result .big{font-size:44px;font-weight:800;color:var(--pink-dark);line-height:1.1}
  .result .msg{font-size:14px;margin:8px 0 12px;color:var(--text-mid)}
  .result .best{font-size:12px;color:var(--text-dim);margin-top:10px}
  .result .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .hidden{display:none!important}
</style>
</head>

/* ===== EXAM DATA — add new rounds to this array ===== */
const ROUNDS=[{"id": "r1", "title": "Round 1", "subtitle": "Korean → Tagalog + Picture situation", "questions": [{"q": "손님이 들어왔을 때 가장 먼저 뭐라고 해야 합니까?", "ko": "손님이 들어왔을 때 가장 먼저 뭐라고 해야 합니까?", "o": ["안녕히 가세요", "어서 오세요", "계산해 주세요", "죄송합니다"], "a": 1, "why": "어서 오세요 = Welcome! Ito ang unang bati pagpasok ng customer. 안녕히 가세요 = paalam, 계산해 주세요 = pakibayaran/pa-bill, 죄송합니다 = pasensya na po."}, {"q": "\"몇 분이세요?\" Ano ibig sabihin?", "ko": "몇 분이세요?", "o": ["Ilang oras na po?", "Ilan po kayo?", "Magkano po?", "Anong oras po?"], "a": 1, "why": "몇 분이세요? = Ilan po kayo? (ilang tao). Ang 분 dito ay magalang na pantawag sa tao, hindi 'minuto'."}, {"q": "Customer: \"메뉴판 주세요\" Ano gusto nya?", "ko": "메뉴판 주세요", "o": ["Tubig", "Bill", "Menu", "Susi"], "a": 2, "why": "메뉴판 = menu (menu board/book), 주세요 = pakibigay po. Kaya humihingi ng menu."}, {"q": "\"덜 맵게 해 주세요\" Kailan sinasabi?", "ko": "덜 맵게 해 주세요", "o": ["Pag ayaw ng maanghang masyado", "Pag gusto sobrang anghang", "Pag gusto malamig", "Pag gusto takeout"], "a": 0, "why": "덜 = mas kaunti, 맵게 = maanghang. 덜 맵게 해 주세요 = pakigawang hindi masyadong maanghang."}, {"q": "\"포장해 드릴까요? 매장에서 드실 거예요?\" Ano pinagkaiba?", "ko": "포장해 드릴까요? 매장에서 드실 거예요?", "o": ["Takeout vs Dine-in", "Cash vs Card", "Maanghang vs Hindi", "Malaki vs Maliit"], "a": 0, "why": "포장 = takeout (ipapabalot). 매장에서 먹다 = kakain sa loob ng store (dine-in)."}, {"q": "\"계산은 프런트에서 해 주세요\" Saan magbabayad?", "ko": "계산은 프런트에서 해 주세요", "o": ["Sa kusina", "Sa front desk", "Sa CR", "Sa labas"], "a": 1, "why": "계산 = bayad/billing, 프런트 = front desk. Magbayad po sa front desk."}, {"q": "Picture: Mesa may plato, kutsara, chopstick, baso na maayos. Ano tawag?", "pic": {"em": "🍽️ 🥄 🥢 🥛", "cap": "Mesa na may plato, kutsara, chopstick, at baso — maayos ang pagkakalagay"}, "o": ["쓰레기", "테이블 세팅", "분리수거", "방역"], "a": 1, "why": "테이블 세팅 = table setting (pag-aayos ng mesa). 쓰레기 = basura, 분리수거 = paghihiwalay ng basura, 방역 = disinfection."}, {"q": "\"바닥이 미끄러우니 조심하세요\" Ano dapat gawin?", "ko": "바닥이 미끄러우니 조심하세요", "o": ["Tumakbo mabilis", "Dahan-dahan maglakad", "Tumalon", "Umupo"], "a": 1, "why": "바닥 = sahig, 미끄럽다 = madulas, 조심하세요 = mag-ingat po. Kaya dahan-dahan maglakad."}, {"q": "\"음식물 쓰레기는 바로 치워야 합니다\" Bakit?", "ko": "음식물 쓰레기는 바로 치워야 합니다", "o": ["Para magka-ipis at langaw - iwasan", "Para dumami ipis", "Para bumaho lalo", "Wala lang"], "a": 0, "why": "음식물 쓰레기 = food waste. Dapat agad linisin (바로 치우다) para iwasan ang ipis, langaw, at masamang amoy."}, {"q": "Customer galit: \"이 음식에 머리카락이 있어요!\" Ano BEST sagot ng staff?", "ko": "이 음식에 머리카락이 있어요!", "o": ["아니에요, 없어요 - Wala yan!", "그냥 먹어 - Kainin mo na lang!", "정말 죄송합니다. 새 음식으로 교환해 드리겠습니다", "무시 - Ignore"], "a": 2, "why": "머리카락 = buhok. Ang tamang sagot: humingi ng tawad at palitan ang pagkain — 정말 죄송합니다 (pasensya na po), 새 음식으로 교환해 드리겠습니다 (papalitan po namin ng bagong pagkain)."}, {"q": "\"빈방 / 만실\" Saang lugar madalas makita?", "o": ["Restaurant", "Hotel", "Kusina", "Basurahan"], "a": 1, "why": "빈방 = bakanteng kuwarto, 만실 = puno na / fully booked. Makikita ito sa hotel o tuluyan."}, {"q": "\"조식은 7시부터 9시까지입니다\" Ano ibig sabihin ng notice?", "ko": "조식은 7시부터 9시까지입니다", "o": ["Breakfast 7am-9am lang", "Lunch 7-9", "Dinner 7-9", "Sarado 7-9"], "a": 0, "why": "조식 = almusal. 7시부터 9시까지 = mula 7 hanggang 9."}, {"q": "\"카드 돼요? - 현금만 됩니다\" Ano ibig sabihin ng sagot?", "ko": "카드 돼요? 현금만 됩니다", "o": ["Pwede card", "Cash lang pwede", "Libre lahat", "Sarado na"], "a": 1, "why": "카드 돼요? = Pwede ba ang card? 현금만 됩니다 = cash lang po ang tinatanggap."}, {"q": "\"유통기한이 지났습니다\" Ano ibig sabihin?", "ko": "유통기한이 지났습니다", "o": ["Sariwa pa", "Expired na - panis na", "Bagong luto", "Masarap pa"], "a": 1, "why": "유통기한 = expiration/sell-by date, 지났습니다 = lumampas na. Expired na ito."}, {"q": "\"앞치마, 위생모, 장갑을 껴야 합니다\" Bakit?", "ko": "앞치마, 위생모, 장갑을 껴야 합니다", "o": ["Para maganda tingnan", "Para sa hygiene / kalinisan", "Para malamigan", "Para matakot customer"], "a": 1, "why": "앞치마 = apron, 위생모 = hygiene cap, 장갑 = gloves. Isinusuot para sa kalinisan (위생)."}, {"q": "\"따로 계산해 주세요 / 같이 계산해 주세요\" Ano pinagkaiba?", "ko": "따로 계산해 주세요. 같이 계산해 주세요", "o": ["Hiwalay bayad / Sabay bayad", "Takeout / Dine-in", "Cash / Card", "Malaki / Maliit"], "a": 0, "why": "따로 = hiwalay, 같이 = sabay/magkasama. Kaya hiwalay na bayad vs sabay na bayad."}, {"q": "\"사이즈를 교환하고 싶어요\" Saang shop ito madalas?", "ko": "사이즈를 교환하고 싶어요", "o": ["Restaurant", "Clothing shop / Retail", "Hotel", "Hospital"], "a": 1, "why": "사이즈 = size, 교환 = palit/exchange. Karaniwan sa tindahan ng damit o retail."}, {"q": "\"오늘 야근해야 합니다\" Ano ibig sabihin sa work?", "ko": "오늘 야근해야 합니다", "o": ["Maaga uwi", "May overtime hanggang gabi", "Walang pasok", "May party"], "a": 1, "why": "야근 = overtime sa gabi. Kailangan magtrabaho nang lampas sa normal na oras ngayong araw."}, {"q": "\"지각하면 안 됩니다\" Ano RULE?", "ko": "지각하면 안 됩니다", "o": ["Bawal ma-late - Dapat maaga pumasok", "Pwede ma-late", "Dapat matulog", "Pwede absent"], "a": 0, "why": "지각 = pagiging late, ~하면 안 됩니다 = bawal. Bawal ma-late."}, {"q": "\"정말 죄송합니다. 불편을 드려서 죄송합니다\" Kailan sinasabi?", "ko": "정말 죄송합니다. 불편을 드려서 죄송합니다", "o": ["Pag papasok customer - Welcome", "Pag may complaint / may mali - mag-sorry", "Pag magbabayad - Bill", "Pag kakain - Kain na"], "a": 1, "why": "죄송합니다 = pasensya na po, 불편 = abala. Sinasabi ito kapag may reklamo o pagkakamali."}]}];
const STORE="eps_service1_exam_v1";
const THEME_KEY="korean_quiz_theme";
const LET=["A","B","C","D"];
let ri=0, ans={}, done=false, t0=Date.now(), tick=null, subset=null;

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function load(){try{return JSON.parse(localStorage.getItem(STORE)||"{}");}catch(e){return {};}}
function save(o){try{localStorage.setItem(STORE,JSON.stringify(o));}catch(e){}}
function round(){return ROUNDS[ri];}
function qs(){return subset||round().questions.map(function(_,i){return i;});}

function toggleTheme(){
  document.body.classList.toggle("dark");
  try{localStorage.setItem(THEME_KEY,document.body.classList.contains("dark")?"dark":"light");}catch(e){}
  document.getElementById("theme").textContent=document.body.classList.contains("dark")?"☀️":"🌙";
}
(function(){try{if(localStorage.getItem(THEME_KEY)==="dark"){document.body.classList.add("dark");document.getElementById("theme").textContent="☀️";}}catch(e){}})();

function speak(i){
  try{
    const u=new SpeechSynthesisUtterance(round().questions[i].ko); u.lang="ko-KR"; u.rate=.85;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
function fmt(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function startTimer(){
  clearInterval(tick); t0=Date.now();
  tick=setInterval(updateProg,1000);
}
function updateProg(){
  const n=qs().length, a=qs().filter(function(i){return ans[i]!==undefined;}).length;
  document.getElementById("progtext").textContent="Answered "+a+"/"+n+(done?"":" · "+fmt(Date.now()-t0));
  document.getElementById("fill").style.width=(a/n*100)+"%";
}

function renderRounds(){
  const el=document.getElementById("rounds");
  const best=load();
  el.innerHTML=ROUNDS.map(function(r,i){
    const b=best[r.id]; 
    return '<button class="chip'+(i===ri?' on':'')+'" onclick="pickRound('+i+')">'+esc(r.title)+(b!==undefined?' · best '+b+'/'+r.questions.length:'')+'</button>';
  }).join("")+'<span class="meta" id="meta"></span>';
  document.getElementById("sub").textContent=round().subtitle+" · "+round().questions.length+" questions";
}
function pickRound(i){ri=i;reset(true);}
function reset(all){
  ans={};done=false;subset=null;
  document.getElementById("result").innerHTML="";
  document.getElementById("rules").classList.remove("hidden");
  document.getElementById("go").textContent="Submit";
  renderRounds();renderList();startTimer();updateProg();
  window.scrollTo({top:0,behavior:"smooth"});
}
function renderList(){
  const R=round();
  document.getElementById("list").innerHTML=qs().map(function(i,pos){
    const q=R.questions[i];
    let st="";
    if(done){ st=ans[i]===undefined?" skip":(ans[i]===q.a?" right":" wrong"); }
    const pic=q.pic?'<div class="pic"><div class="em">'+q.pic.em+'</div><div class="cap">'+esc(q.pic.cap)+'</div></div>':'';
    const opts=q.o.map(function(t,k){
      let c="opt";
      if(done){ if(k===q.a)c+=" correct"; else if(ans[i]===k)c+=" incorrect"; }
      else if(ans[i]===k) c+=" sel";
      return '<button class="'+c+'"'+(done?' disabled':'')+' onclick="choose('+i+','+k+')"><span class="L">'+LET[k]+')</span><span>'+esc(t)+'</span></button>';
    }).join("");
    let why="";
    if(done){
      const mine=ans[i]===undefined?"Walang sagot":("Sagot mo: "+LET[ans[i]]);
      why='<div class="why"><b>'+(ans[i]===q.a?"✅ Tama!":"❌ "+mine+" · Tamang sagot: "+LET[q.a])+'</b><br>'+esc(q.why)+'</div>';
    }
    return '<div class="q'+st+'" id="q'+i+'"><div class="qhead"><span class="qnum">Q'+(i+1)+'</span><div class="qtext">'+esc(q.q)+'</div>'+(q.ko?'<button class="spk" title="Listen" onclick="speak('+i+')">🔊</button>':'')+'</div>'+pic+'<div class="opts">'+opts+'</div>'+why+'</div>';
  }).join("");
}
function choose(i,k){ if(done)return; ans[i]=k; 
  const card=document.getElementById("q"+i);
  card.querySelectorAll(".opt").forEach(function(b,j){b.classList.toggle("sel",j===k);});
  updateProg();
}
function applyQuick(){
  if(done)return;
  const txt=document.getElementById("quick").value, re=/(\d{1,2})\s*([A-Da-d])/g; let m,n=0;
  while((m=re.exec(txt))){ const i=parseInt(m[1],10)-1; if(i>=0&&i<round().questions.length&&qs().indexOf(i)>=0){ans[i]="ABCD".indexOf(m[2].toUpperCase());n++;} }
  renderList();updateProg();
  if(!n) alert("Walang nabasang sagot. Halimbawa: 1A 2C 3B");
}
function submitExam(){
  if(done){reset(true);return;}
  const R=round(), idx=qs();
  const left=idx.filter(function(i){return ans[i]===undefined;}).length;
  if(left && !confirm(left+" tanong ang wala pang sagot. Mag-submit pa rin?")) return;
  done=true; clearInterval(tick);
  const score=idx.filter(function(i){return ans[i]===R.questions[i].a;}).length, n=idx.length;
  const pct=Math.round(score/n*100);
  let best="";
  if(!subset){ const b=load(); if(b[R.id]===undefined||score>b[R.id]){b[R.id]=score;save(b);} best='Best score: '+b[R.id]+'/'+n; }
  const msg=pct>=90?"Ang galing! Parang manager ka na sa restaurant! 🐷🏆":pct>=75?"Magaling! Konting review na lang. 🐽":pct>=50?"Okay naman! Balikan natin ang mga mali. 💪":"Okay lang, review ulit tayo — kaya mo 'yan! 🐖";
  const wrong=idx.filter(function(i){return ans[i]!==R.questions[i].a;});
  document.getElementById("result").innerHTML=
    '<div class="result"><div class="big">'+score+' / '+n+'</div><div class="msg">'+pct+'% · '+msg+'</div>'+
    '<div class="acts"><button class="chip on" onclick="reset(true)">🔁 Retake all</button>'+
    (wrong.length?'<button class="chip" onclick="retryWrong()">🎯 Retry wrong only ('+wrong.length+')</button><button class="chip" onclick="jumpFirstWrong()">👀 See first mistake</button>':'')+
    '</div><div class="best">'+best+' · Time '+fmt(Date.now()-t0)+'</div></div>';
  document.getElementById("rules").classList.add("hidden");
  document.getElementById("go").textContent="Retake";
  renderRounds();renderList();updateProg();
  window.scrollTo({top:0,behavior:"smooth"});
}
function retryWrong(){
  const R=round();
  const w=qs().filter(function(i){return ans[i]!==R.questions[i].a;});
  subset=w; ans={}; done=false;
  document.getElementById("result").innerHTML="";
  document.getElementById("rules").classList.remove("hidden");
  document.getElementById("go").textContent="Submit";
  document.getElementById("sub").textContent=R.subtitle+" · retry "+w.length+" wrong";
  renderList();startTimer();updateProg();window.scrollTo({top:0,behavior:"smooth"});
}
function jumpFirstWrong(){
  const el=document.querySelector(".q.wrong,.q.skip"); if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
}
renderRounds();renderList();startTimer();updateProg();
</script>
</body>
